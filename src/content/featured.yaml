  title: Spotting robot faults from cameras alone
  caption: "AWARE (CoRL 2026): camera-only state estimation, a world model trained in simulation to predict the crane's dynamics, and live detection of a weakened motor as the warning light turns red."
  href: "#pub-aware2026"
  wide: true
  clip:
    video: /media/aware_summary_1280.mp4
    poster: /media/aware_summary_1280_poster.jpg
