  note: 20.6 s montage from the AWARE project page, built by scripts/media/aware_montage.sh (2026-11-10).
- id: tmech
  order: 3
  title: Grasping real groceries with reinforcement learning
  caption: Trained in simulation with force feedback from modelled compliant fingers; 95.8% success on 42 grocery items.
  href: "#pub-tmech2024"
  clip:
    video: /media/tmech_grocery_800.mp4
    poster: /media/tmech_grocery_800_poster.jpg
    alt: A robot arm with a three-finger gripper picking up grocery items one after another, at five times speed.
- id: iros2024
  order: 4
  title: Does a movable palm help?
  caption: The same grasps with and without the palm, using controllers trained for 24 gripper designs; 96% best real-world success with the palm.
  href: "#pub-iros2024"
  clip:
    video: /media/iros24_palm_800.mp4
    poster: /media/iros24_palm_800_poster.jpg
    alt: Two identical grippers side by side grasping objects, one using a movable palm and one not, at twice speed.
