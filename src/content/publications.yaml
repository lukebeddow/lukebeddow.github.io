- id: aware2026
  order: 1
  title: "Adaptive World-Models for Anomaly Recognition (AWARE): A Framework for Robot Dynamics Prediction and Introspection"
  authors: [Luke Beddow, George Mavroghenis, Rodrigo Chacon Quesada, Kamil Dreczkowski, Cong Sun, Jiankai Wang, Oscar Kwong-Fai Pang, Antoine Cully]
  venue: Conference on Robot Learning (CoRL)
  year: 2026
  kind: conference
  summary: A world model that detects anomalies from external cameras alone, by estimating system dynamics and predicting state; 26% better anomaly classification than the strongest baseline across 240 real robotic-crane trajectories.
  links:
    - { label: project page, url: "https://adaptive-intelligent-robotics.github.io/aware/" }
    - { label: paper, url: "https://arxiv.org/abs/2610.32742" }
    - { label: code, url: "https://github.com/adaptive-intelligent-robotics/aware" }
  note: Title, authors and abstract from arXiv 2610.32742 (2026-10-23); venue confirmed by Luke (2026-11-10). Clip is the summary montage shared with the featured band.
