  about:
    - text: >-
        I research robot learning for industrial applications such as factory automation, where the aim is
        high reliability. At EGI I work on imitation learning and offline and online
        reinforcement learning, with vision-language-action models (VLAs) and learned control policies.
        It is a startup, so the role is varied: I also do a good deal of robotics engineering.
      draft: true
