    - text: >-
        Before EGI I was a Research Associate at Imperial College London, building world models for robot
        control and deploying them on an underactuated crane robot and a quadruped. My PhD at
        UCL's Robot Perception and Learning Lab developed reinforcement learning methods and a
        caging-inspired gripper for grasping groceries, tested extensively on real hardware.
