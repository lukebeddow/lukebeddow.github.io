# Who Luke is, in one place. Sources: Luke (2026-11-09), the CV (Overleaf, Nov 2026), the 2024 site.
luke:
  name: Luke Beddow
  headline: Reinforcement learning for real-world robotics.
  description: Founding ML research engineer at Embodied General Intelligence, working on reinforcement learning for real-world robotics, world models, VLAs and robot systems.
  photo: /media/profile-photo-480.webp
  email: lukebeddow@gmail.com
  links:
    - { label: Google Scholar, url: "https://scholar.google.com/citations?user=Dx_CURwAAAAJ&hl=en" }
    - { label: GitHub, url: "https://github.com/lukebeddow" }
    - { label: LinkedIn, url: "https://www.linkedin.com/in/luke-beddow-130264171/" }
  about:
    - text: >-
        I work on reinforcement learning for real-world robotics, and on the systems that let learned
        control run reliably on real hardware. At Embodied General Intelligence I lead our offline and online
        reinforcement learning for industrial automation, fine-tuning vision-language-action models (VLAs) for
        high-precision tasks, and build much of the robot stack they run on. At Imperial College London I
        developed world models that detect robot faults from cameras alone (CoRL 2026) and trained
        reinforcement learning controllers for a robotic crane, from simulation to hardware. My PhD at UCL
        used reinforcement learning and a new gripper design to grasp groceries reliably.
      draft: true
      note: Shortened 2026-11-10 to Luke's brief - RL for real-world robotics across three roles; world models, VLAs, robot systems engineering.
  updated: "2026-11"
