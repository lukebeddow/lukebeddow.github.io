luke:
  name: Luke Beddow
  headline: Robotics researcher working on robot learning for reliable industrial automation.
  description: Robotics researcher working on robot learning (imitation learning, reinforcement learning, VLAs) for reliable industrial automation. PhD, UCL.
  photo: /media/profile-photo-480.webp
