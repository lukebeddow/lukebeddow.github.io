# Who Luke is, in one place. Sources: Luke (2026-11-09), the CV (Overleaf, Nov 2026), the 2024 site.
luke:
  name: Luke Beddow
  headline: Reinforcement learning for real-world robot deployment.
  description: Reinforcement learning and learned robot control for real-world deployment. Founding ML research engineer at Embodied General Intelligence; PhD, UCL.
  photo: /media/profile-photo-480.webp
  email: lukebeddow@gmail.com
  links:
    - { label: Google Scholar, url: "https://scholar.google.com/citations?user=Dx_CURwAAAAJ&hl=en" }
    - { label: GitHub, url: "https://github.com/lukebeddow" }
    - { label: LinkedIn, url: "https://www.linkedin.com/in/luke-beddow-130264171/" }
  about:
    - text: >-
        I specialise in learned robot control policies for real-world deployment. My main research focus is
        reinforcement learning, from fine-tuning vision-language-action models (VLAs) to training high-frequency
        controllers. At Embodied General Intelligence I lead reinforcement learning research, deploying offline
        and online methods on high-precision tasks such as bimanual factory assembly for major European
        industrial clients.
      note: Luke's final text (2026-11-15).
    - text: >-
        Before that I was a postdoc at Imperial College London, working on world models and control policies
        for critical infrastructure (CoRL 2026), and I completed my PhD at University College London on
        reinforcement learning for autonomous grocery grasping.
  updated: "2026-11"
